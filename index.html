<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ELECTRICAL QC 360</title><style>
:root{--bg:#07111f;--side:#081524;--p:#0e1c2d;--p2:#12243a;--line:#20364f;--blue:#2584ff;--cyan:#20d2e8;--text:#e9f1fb;--muted:#91a8c0;--green:#31d59a;--amber:#f2bd48;--red:#ff6678}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,Segoe UI,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.layout{display:flex;min-height:100vh}.sidebar{width:245px;background:var(--side);border-right:1px solid var(--line);padding:17px 13px;display:flex;flex-direction:column;gap:17px;flex-shrink:0}.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 17px;border-bottom:1px solid var(--line)}.brand-icon{width:40px;height:40px;border-radius:12px;background:linear-gradient(145deg,#1679ff,#06c8e6);display:grid;place-items:center;font-size:21px;font-weight:900}.brand strong{font-size:13px;letter-spacing:.5px}.brand small{display:block;color:var(--muted);font-size:9px;margin-top:3px}.nav-title{color:#6e87a2;font-size:10px;letter-spacing:1.4px;padding:0 10px}.nav{display:grid;gap:3px}.nav button{background:transparent;color:#a8bdd2;border:0;text-align:left;padding:10px 12px;border-radius:9px;display:flex;gap:11px;align-items:center}.nav button:hover,.nav button.active{background:#132b45;color:#fff}.nav button.active{box-shadow:inset 3px 0 var(--blue)}.nav .ico{width:20px;text-align:center;font-size:16px}.sidefoot{margin-top:auto;border:1px solid var(--line);border-radius:11px;padding:12px;color:var(--muted);font-size:11px}.sidefoot b{color:var(--cyan);display:block;margin-bottom:4px}.main{flex:1;min-width:0}.topbar{height:65px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 26px;background:#091625}.crumb{color:var(--muted)}.crumb b{color:var(--text)}.topactions{display:flex;align-items:center;gap:13px}.demo{color:var(--green);font-size:11px}.avatar{background:#1a3654;border-radius:50%;width:34px;height:34px;display:grid;place-items:center;font-weight:700}.content{padding:25px 27px;max-width:1500px;margin:auto}.welcome{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:22px}.welcome h1{font-size:24px;margin:0 0 6px}.welcome p{color:var(--muted);margin:0}.btn{border:1px solid #2765a9;background:#1468d8;color:white;border-radius:8px;padding:9px 13px;font-weight:600}.btn.secondary{background:var(--p2);border-color:var(--line);color:#dce9f7}.btn.ghost{background:transparent;border-color:var(--line);color:var(--muted)}.btn.danger{background:#5c2230;border-color:#813245}.btn.sm{padding:6px 9px;font-size:11px}.cards{display:grid;grid-template-columns:repeat(4,minmax(145px,1fr));gap:12px}.card{background:var(--p);border:1px solid var(--line);border-radius:12px;padding:16px}.kpi{display:flex;justify-content:space-between;gap:10px}.label{color:var(--muted);font-size:11px}.num{font-size:27px;font-weight:700;margin:9px 0 5px}.foot{font-size:11px;color:var(--muted)}.kicon{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;background:#17365b;color:#6ab4ff;font-size:17px}.green{color:var(--green)}.amber{color:var(--amber)}.blue{color:#63adff}.red{color:var(--red)}.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:13px;margin-top:14px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.head h2{font-size:14px;margin:0}.head small{color:var(--muted);font-size:11px}.progressrow{display:flex;justify-content:space-between;margin:13px 0 6px;font-size:12px}.bar{height:7px;background:#1b3048;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;border-radius:10px;background:linear-gradient(90deg,#167bff,#20d2e8)}.score{display:flex;align-items:center;gap:16px}.ring{width:90px;height:90px;border-radius:50%;background:conic-gradient(var(--green) 0 92%,#23384d 92%);display:grid;place-items:center;position:relative}.ring:before{content:'';position:absolute;inset:8px;background:var(--p);border-radius:50%}.ring strong{z-index:1;font-size:21px}.scoretxt{color:var(--muted);font-size:11px}.scoretxt b{display:block;color:var(--green);font-size:13px;margin-bottom:4px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:12px;min-width:540px}.table th{text-align:left;color:#7f98b2;font-weight:500;padding:9px 7px;border-bottom:1px solid var(--line)}.table td{padding:11px 7px;border-bottom:1px solid #182b3f;vertical-align:middle}.status{border-radius:20px;padding:4px 8px;font-size:10px;white-space:nowrap;display:inline-block}.pending{background:#3d321a;color:var(--amber)}.progress{background:#163958;color:#64b6ff}.done{background:#123b32;color:var(--green)}.fail{background:#49202c;color:var(--red)}.activity{display:grid;gap:12px}.act{display:flex;gap:10px;align-items:flex-start;font-size:12px}.acticon{width:28px;height:28px;border-radius:8px;background:#17324e;display:grid;place-items:center;flex-shrink:0}.act p{margin:0 0 3px}.act small{color:var(--muted)}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}.search{background:#091625;border:1px solid var(--line);border-radius:8px;color:var(--text);padding:9px 10px;min-width:180px}.tag{border:1px solid #24527b;color:#6eb8ff;border-radius:7px;padding:4px 8px;font-size:10px;display:inline-block}.notice{padding:11px 13px;border:1px solid #624f26;background:#2b2619;color:#e7c56f;border-radius:9px;font-size:11px;margin-bottom:14px}.empty{padding:40px;text-align:center;color:var(--muted)}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{display:grid;gap:5px;margin:8px 0}.field label{font-size:11px;color:var(--muted)}.field input,.field select,.field textarea{background:#081625;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px;width:100%}.field textarea{min-height:80px;resize:vertical}.modalback{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:14px;z-index:10}.modal{width:min(650px,100%);max-height:90vh;overflow:auto;background:var(--p);border:1px solid var(--line);border-radius:14px;padding:20px}.modal h2{margin:0 0 15px;font-size:18px}.modalactions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.checkrow{display:flex;align-items:flex-start;gap:10px;padding:11px;border-bottom:1px solid var(--line);font-size:12px}.checkrow input{margin-top:2px;accent-color:var(--blue)}.checkrow small{display:block;color:var(--muted);margin-top:3px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mobiletoggle{display:none}.muted{color:var(--muted)}@media(max-width:1050px){.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}@media(max-width:700px){.sidebar{display:none}.content{padding:16px 12px}.topbar{padding:0 14px}.welcome{display:block}.welcome .btn{margin-top:13px}.cards{gap:8px}.card{padding:12px}.num{font-size:23px}.mobiletoggle{display:inline-block}.formgrid,.two{grid-template-columns:1fr}.topactions{gap:7px}}
</style></head><body><div class="layout"><aside class="sidebar"><div class="brand"><div class="brand-icon">⚡</div><div><strong>ELECTRICAL QC <span style="color:#35b9ff">360</span></strong><small>QUALITY CONTROL SYSTEM</small></div></div><div class="nav-title">WORKSPACE</div><nav class="nav" id="nav"></nav><div class="sidefoot"><b>● QC WORKSPACE</b>Prototipo funcional · Datos de ejemplo<br>Persistencia local en este navegador</div></aside><main class="main"><header class="topbar"><div class="crumb"><span class="mobiletoggle">☰ &nbsp;</span> ELECTRICAL QC 360 / <b id="crumb">Dashboard</b></div><div class="topactions"><span class="demo">● PROTOTIPO</span><div class="avatar">QC</div></div></header><div class="content" id="content"></div></main></div><div class="modalback" id="modalback"><div class="modal" id="modal"></div></div>
<script>
const menu=[['Dashboard','▦'],['Proyectos','⌂'],['Inspecciones','☑'],['Checklists','☷'],['Plan ITP','▤'],['Pruebas eléctricas','ϟ'],['No conformidades','⚠'],['Informes','▧'],['Liberaciones','✓'],['Indicadores KPI','◫'],['Biblioteca NEC','▣']];
const $=s=>document.querySelector(s);const nav=$('#nav');let active='Dashboard';
let store={inspections:[],tests:[],ncs:[],projects:[{name:'Proyecto demostrativo',site:'Sitio por configurar',status:'En ejecución',progress:68}],releases:[],checkstate:{}};
try{let saved=JSON.parse(localStorage.getItem('eqc360'));if(saved)store={...store,...saved}}catch(e){}
function persist(){localStorage.setItem('eqc360',JSON.stringify(store))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function badge(s){let cls=s==='Aprobado'||s==='Cerrada'||s==='Liberado'?'done':s==='No aprobado'||s==='Crítica'?'fail':s==='En proceso'?'progress':'pending';return '<span class="status '+cls+'">'+esc(s)+'</span>'}
function table(headers,rows){return '<div class="tablewrap"><table class="table"><thead><tr>'+headers.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table></div>'}
function showModal(title,body,submitLabel='Guardar',handler=null){$('#modal').innerHTML='<h2>'+title+'</h2>'+body+'<div class="modalactions"><button class="btn ghost" id="closemodal">Cancelar</button><button class="btn" id="submitmodal">'+submitLabel+'</button></div>';$('#modalback').style.display='flex';$('#closemodal').onclick=()=>$('#modalback').style.display='none';$('#submitmodal').onclick=()=>{if(handler)handler();};}
$('#modalback').onclick=e=>{if(e.target===$('#modalback'))$('#modalback').style.display='none'};
function field(label,id,placeholder='',type='text'){return '<div class="field"><label>'+label+'</label><input id="'+id+'" type="'+type+'" placeholder="'+placeholder+'"></div>'}
function selectfield(label,id,opts){return '<div class="field"><label>'+label+'</label><select id="'+id+'">'+opts.map(o=>'<option>'+o+'</option>').join('')+'</select></div>'}
function textarea(label,id,placeholder){return '<div class="field"><label>'+label+'</label><textarea id="'+id+'" placeholder="'+placeholder+'"></textarea></div>'}
function addinspection(){showModal('Registrar inspección','<div class="formgrid">'+field('Actividad / elemento','ia','Ej. Inspección tablero TD-02')+selectfield('Sistema','isys',['Tableros eléctricos','Canalizaciones','Conductores y cableado','Puesta a tierra','Iluminación','Generadores','Transformadores','Motores','Otros'])+selectfield('Estado','ist',['Pendiente','En proceso','Aprobado','No aprobado'])+field('Responsable','iowner','Inspector / responsable')+'</div>'+textarea('Observaciones','inote','Descripción, criterio, evidencia...'),'Registrar',()=>{let a=$('#ia').value.trim();if(!a){alert('Ingresa actividad');return}store.inspections.unshift({activity:a,system:$('#isys').value,status:$('#ist').value,owner:$('#iowner').value,date:new Date().toLocaleDateString(),note:$('#inote').value});persist();$('#modalback').style.display='none';render('Inspecciones')})}
function addtest(){showModal('Registrar prueba eléctrica','<div class="formgrid">'+field('Equipo / circuito','te','Ej. Alimentador F-01')+selectfield('Tipo de prueba','tt',['Resistencia de aislamiento','Continuidad','Resistencia de puesta a tierra','Secuencia de fases','Termografía','Prueba funcional','Otros'])+field('Resultado / lectura','tr','Valor medido y unidad')+field('Instrumento','ti','Marca / modelo / ID')+selectfield('Estado','ts',['Pendiente de evaluación','Conforme','No conforme'])+field('Responsable','to','Técnico')+'</div>'+textarea('Notas y referencia de criterio','tn','Criterio aprobado, especificación o norma aplicable'),'Guardar prueba',()=>{if(!$('#te').value.trim()){alert('Indica el equipo o circuito');return}store.tests.unshift({equipment:$('#te').value,type:$('#tt').value,result:$('#tr').value,instrument:$('#ti').value,status:$('#ts').value,owner:$('#to').value,note:$('#tn').value,date:new Date().toLocaleDateString()});persist();$('#modalback').style.display='none';render('Pruebas eléctricas')})}
function addnc(){showModal('Registrar no conformidad','<div class="formgrid">'+field('Título del hallazgo','nt','Descripción breve')+selectfield('Sistema','ns',['Tableros eléctricos','Canalizaciones','Conductores','Puesta a tierra','Iluminación','Transformadores','Otros'])+selectfield('Clasificación','nc',['Observación','Menor','Mayor','Crítica'])+field('Responsable','no','Responsable de corrección')+field('Fecha compromiso','nd','', 'date')+'</div>'+textarea('Descripción / evidencia','nn','Condición observada y ubicación...')+textarea('Acción correctiva propuesta','na','Corrección y prevención...'),'Crear NC',()=>{if(!$('#nt').value.trim()){alert('Escribe el título');return}store.ncs.unshift({title:$('#nt').value,system:$('#ns').value,class:$('#nc').value,owner:$('#no').value,due:$('#nd').value,desc:$('#nn').value,action:$('#na').value,status:'Abierta',date:new Date().toLocaleDateString()});persist();$('#modalback').style.display='none';render('No conformidades')})}
function addproject(){showModal('Nuevo proyecto',field('Nombre del proyecto','pn','Nombre')+field('Ubicación','pl','Ubicación')+field('Responsable','po','Responsable')+field('Avance (%)','pp','0','number'),'Crear proyecto',()=>{let n=$('#pn').value.trim();if(!n)return alert('Nombre requerido');store.projects.unshift({name:n,site:$('#pl').value,status:'En ejecución',owner:$('#po').value,progress:Number($('#pp').value||0)});persist();$('#modalback').style.display='none';render('Proyectos')})}
function addrelease(){showModal('Registrar liberación',field('Sistema / equipo','rl','Sistema a liberar')+field('Responsable','ro','Responsable de aprobación')+selectfield('Estado','rs',['Pendiente','En revisión','Liberado','Rechazado'])+textarea('Condiciones / restricciones','rn','Pruebas verificadas, condiciones...'),'Guardar',()=>{if(!$('#rl').value.trim())return alert('Equipo/sistema requerido');store.releases.unshift({system:$('#rl').value,owner:$('#ro').value,status:$('#rs').value,note:$('#rn').value,date:new Date().toLocaleDateString()});persist();$('#modalback').style.display='none';render('Liberaciones')})}
function renderDashboard(){let ins=store.inspections.length,tests=store.tests.length,nc=store.ncs.filter(n=>n.status!=='Cerrada').length;let approved=store.inspections.filter(i=>i.status==='Aprobado').length;let compliance=ins?Math.round(approved/ins*100):'—';return '<div class="welcome"><div><h1>Dashboard de calidad</h1><p>Seguimiento integral de inspecciones, pruebas, hallazgos y liberaciones.</p></div><button class="btn" onclick="addinspection()">＋ Nueva inspección</button></div><div class="cards">'+[['Inspecciones registradas',ins,'Registros creados','☑'],['Cumplimiento de inspecciones',compliance==='—'?'—':compliance+'%',ins?'Calculado sobre registros':'Sin registros','◉'],['No conformidades abiertas',nc,'Pendientes de cierre','⚠'],['Pruebas eléctricas registradas',tests,'Resultados ingresados','ϟ']].map(c=>'<div class="card"><div class="kpi"><div><div class="label">'+c[0]+'</div><div class="num">'+c[1]+'</div><div class="foot">'+c[2]+'</div></div><div class="kicon">'+c[3]+'</div></div></div>').join('')+'</div><div class="grid2"><div class="card"><div class="head"><h2>Proyectos activos</h2><small>'+store.projects.length+' proyecto(s)</small></div>'+table(['Proyecto','Ubicación','Avance'],store.projects.map(p=>'<tr><td><b>'+esc(p.name)+'</b></td><td>'+esc(p.site||'—')+'</td><td><b>'+Number(p.progress||0)+'%</b><div class="bar"><i style="width:'+Math.min(100,Math.max(0,p.progress||0))+'%"></i></div></td></tr>'))+'</div><div class="card"><div class="head"><h2>Alertas / enfoque</h2><small>Vista de control</small></div><div class="activity"><div class="act"><div class="acticon">⚠</div><div><p><b>'+nc+'</b> NC abiertas</p><small>Priorizar hallazgos críticos y fechas compromiso</small></div></div><div class="act"><div class="acticon">ϟ</div><div><p><b>'+tests+'</b> pruebas registradas</p><small>Documentar instrumentos y criterios antes de aceptación</small></div></div><div class="act"><div class="acticon">☑</div><div><p><b>'+ins+'</b> inspecciones creadas</p><small>Registrar evidencia, ubicación y aprobación</small></div></div></div></div></div><div class="grid2"><div class="card"><div class="head"><h2>Últimas inspecciones</h2><button class="btn secondary sm" onclick="render(\'Inspecciones\')">Ver todas</button></div>'+table(['Actividad','Sistema','Estado'],store.inspections.slice(0,5).map(i=>'<tr><td>'+esc(i.activity)+'</td><td>'+esc(i.system)+'</td><td>'+badge(i.status)+'</td></tr>'))+'</div><div class="card"><div class="head"><h2>Datos y criterios</h2></div><div class="notice">Los valores del tablero se calculan con los registros que agregues. No contiene datos reales de obra ni criterios normativos precargados.</div><p class="muted">Antes de liberar un equipo: validar planos, especificaciones, checklist, pruebas requeridas, no conformidades, identificación y autorización.</p></div></div>'}
function renderProjects(){return '<div class="welcome"><div><h1>Proyectos</h1><p>Administración de proyectos, ubicaciones y progreso.</p></div><button class="btn" onclick="addproject()">＋ Nuevo proyecto</button></div><div class="card">'+table(['Proyecto','Sitio','Responsable','Avance','Estado'],store.projects.map(p=>'<tr><td><b>'+esc(p.name)+'</b></td><td>'+esc(p.site||'—')+'</td><td>'+esc(p.owner||'—')+'</td><td>'+Number(p.progress||0)+'%</td><td>'+badge(p.status)+'</td></tr>'))+'</div>'}
function renderInspections(){return '<div class="welcome"><div><h1>Inspecciones</h1><p>Registro de actividades de verificación y control en campo.</p></div><button class="btn" onclick="addinspection()">＋ Nueva inspección</button></div><div class="notice">Registros locales de este prototipo. Para aceptación, documenta el criterio verificable y adjunta evidencia en la futura versión.</div><div class="card">'+table(['Fecha','Actividad','Sistema','Responsable','Estado','Observaciones'],store.inspections.map(i=>'<tr><td>'+esc(i.date)+'</td><td>'+esc(i.activity)+'</td><td>'+esc(i.system)+'</td><td>'+esc(i.owner||'—')+'</td><td>'+badge(i.status)+'</td><td>'+esc(i.note||'—')+'</td></tr>'))+'</div>'}
const checklistItems={'Tableros eléctricos':['Identificación del tablero y circuitos coincide con planos','Gabinete, puertas y barreras sin daños visibles','Accesibilidad y espacio de trabajo verificados','Conexiones y terminaciones inspeccionadas','Barras y terminales identificados según proyecto','Protecciones y ajustes contrastados con estudio / diseño','Puesta a tierra y bonding inspeccionados','Torque documentado según fabricante cuando requerido','Pruebas y registros adjuntos','Tapa, rotulación y cierre final verificados'],'Canalizaciones':['Ruta conforme a planos aprobados','Soportes y espaciamiento según sistema y especificación','Bordes, uniones y accesorios sin daño','Protección contra corrosión verificada','Separación de otros sistemas según diseño','Continuidad / bonding cuando requerido','Sellos y penetraciones ejecutados según detalle','Bujes y protección en entradas','Limpieza y ausencia de obstrucciones','Identificación y entrega de evidencia'],'Conductores y cableado':['Tipo, calibre y material conforme a planos','Identificación de circuito y fases','Inspección visual de aislamiento','Radio de curvatura y manipulación conforme fabricante','Empalmes y terminaciones aprobados','Separación / agrupamiento revisados','Continuidad cuando aplica','Prueba de aislamiento con método y voltaje aprobado','Etiquetado en ambos extremos','Resultados y evidencia registrados'],'Puesta a tierra':['Conductor PE y bonding identificados','Conexiones mecánicas o exotérmicas inspeccionadas','Uniones accesibles y protegidas','Electrodos / malla conforme planos','Equipotencialidad verificada donde aplica','Continuidad del conductor de protección registrada','Medición de resistencia con método documentado','Instrumento y calibración registrados','Resultados comparados con criterio de proyecto','Registro fotográfico y ubicación'],'Iluminación':['Luminaria y modelo conforme especificación','Montaje y fijación completos','Conexiones y polaridad revisadas','Circuito y protección identificados','Control / sensor probado cuando aplica','Prueba funcional de encendido','Medición lux si especificado','Condición de emergencia verificada cuando aplica','Limpieza y acabado','Evidencia y cierre']};
function renderChecklists(){let systems=Object.keys(checklistItems);let sel=store.checklistSystem||systems[0];store.checklistSystem=sel;let items=checklistItems[sel];let done=items.filter((_,i)=>store.checkstate[sel+'_'+i]).length;return '<div class="welcome"><div><h1>Checklists de inspección</h1><p>Lista de verificación por sistema. Marca solo elementos verificados en sitio.</p></div></div><div class="notice">Los checklist son una base de inspección; criterios de aceptación específicos deben venir de planos, NEC aplicable, especificaciones, fabricante o ingeniería aprobada. No sustituyen pruebas ni documentación.</div><div class="card"><div class="toolbar"><select class="search" onchange="store.checklistSystem=this.value;persist();render(\'Checklists\')">'+systems.map(s=>'<option '+(s===sel?'selected':'')+'>'+s+'</option>').join('')+'</select><span class="tag">'+done+' / '+items.length+' completados</span><button class="btn secondary sm" onclick="resetChecklist()">Reset checklist</button></div><div class="bar"><i style="width:'+Math.round(done/items.length*100)+'%"></i></div>'+items.map((it,i)=>'<label class="checkrow"><input type="checkbox" '+(store.checkstate[sel+'_'+i]?'checked':'')+' onchange="toggleCheck(\''+sel+'\','+i+',this.checked)"><span>'+esc(it)+'<small>Estado: '+(store.checkstate[sel+'_'+i]?'Verificado':'Sin verificar')+'</small></span></label>').join('')+'</div>'}
function renderITP(){let phases=['Revisión de documentos y planos aprobados','Recepción e inspección de materiales','Inspección de instalación / montaje','Inspección previa a pruebas','Pruebas eléctricas y funcionales','Corrección de hallazgos','Revisión final y dossier','Liberación para energización'];return '<div class="welcome"><div><h1>Plan ITP</h1><p>Inspection & Test Plan · secuencia de inspección, puntos de control y evidencias.</p></div></div><div class="notice">Puntos Hold / Witness deben acordarse con ingeniería, cliente y QA/QC. Esta matriz es una plantilla ilustrativa, no un ITP aprobado.</div><div class="card">'+table(['Etapa','Control / evidencia','Punto sugerido','Registro'],phases.map((p,i)=>'<tr><td><b>'+p+'</b></td><td>'+['Planos / especificaciones / submittals','Certificados / inspección visual / trazabilidad','Montaje / identificación / fotografías','Checklist previo / seguridad','Resultados / instrumento / método','NC / corrección / re-inspección','Dossier / planos as-built','Permisos / aprobación / autorización'][i]+'</td><td><span class="tag">'+['Review','Witness','Review','Hold','Witness','Hold','Review','Hold'][i]+'</span></td><td><span class="status pending">Por definir</span></td></tr>'))+'</div>'}
function renderTests(){return '<div class="welcome"><div><h1>Pruebas eléctricas</h1><p>Registro trazable de ensayos, lecturas, instrumentos y evaluación.</p></div><button class="btn" onclick="addtest()">＋ Registrar prueba</button></div><div class="notice">Registra voltaje de prueba, método, duración, condiciones, límites de aceptación e instrumento conforme a procedimiento aprobado. No se generan límites automáticos sin conocer equipo, tensión nominal, norma, fabricante y especificación.</div><div class="card">'+table(['Fecha','Equipo','Prueba','Resultado / lectura','Instrumento','Estado'],store.tests.map(t=>'<tr><td>'+esc(t.date)+'</td><td>'+esc(t.equipment)+'</td><td>'+esc(t.type)+'</td><td>'+esc(t.result||'—')+'</td><td>'+esc(t.instrument||'—')+'</td><td>'+badge(t.status)+'</td></tr>'))+'</div>'}
function renderNC(){return '<div class="welcome"><div><h1>No conformidades</h1><p>Control de hallazgos, responsables, acciones correctivas y verificación de cierre.</p></div><button class="btn" onclick="addnc()">＋ Nueva NC</button></div><div class="card">'+table(['Fecha','Hallazgo','Sistema','Clasificación','Responsable','Compromiso','Estado','Acción'],store.ncs.map(n=>'<tr><td>'+esc(n.date)+'</td><td><b>'+esc(n.title)+'</b><br><small>'+esc(n.desc||'')+'</small></td><td>'+esc(n.system)+'</td><td>'+badge(n.class)+'</td><td>'+esc(n.owner||'—')+'</td><td>'+esc(n.due||'—')+'</td><td>'+badge(n.status)+'</td><td>'+esc(n.action||'—')+(n.status!=='Cerrada'?' <button class="btn sm secondary" onclick="closeNC('+store.ncs.indexOf(n)+')">Cerrar</button>':'')+'</td></tr>'))+'</div>'}
function renderReports(){return '<div class="welcome"><div><h1>Informes técnicos</h1><p>Resumen de registros actuales del prototipo y exportación.</p></div><button class="btn" onclick="printReport()">↗ Imprimir / PDF</button></div><div class="cards">'+[['Proyectos',store.projects.length],['Inspecciones',store.inspections.length],['Pruebas',store.tests.length],['NC abiertas',store.ncs.filter(n=>n.status!=='Cerrada').length]].map(c=>'<div class="card"><div class="label">'+c[0]+'</div><div class="num">'+c[1]+'</div></div>').join('')+'</div><div class="card" style="margin-top:14px"><h3>Contenido del informe</h3><ul><li>Resumen de proyectos y avance</li><li>Inspecciones registradas y estados</li><li>Pruebas y resultados ingresados</li><li>No conformidades y acciones</li><li>Estado de liberaciones</li></ul><p class="muted">El botón imprime el resumen que puede guardarse como PDF desde el navegador.</p></div>'}
function renderRelease(){return '<div class="welcome"><div><h1>Liberaciones</h1><p>Control de cierre de inspecciones y autorización de sistemas.</p></div><button class="btn" onclick="addrelease()">＋ Nueva liberación</button></div><div class="notice">Una liberación no equivale automáticamente a permiso de energización. Debe existir autorización formal, procedimientos de seguridad, LOTO / control de energías y requisitos del sitio.</div><div class="card">'+table(['Fecha','Sistema','Responsable','Estado','Condiciones'],store.releases.map(r=>'<tr><td>'+esc(r.date)+'</td><td>'+esc(r.system)+'</td><td>'+esc(r.owner||'—')+'</td><td>'+badge(r.status)+'</td><td>'+esc(r.note||'—')+'</td></tr>'))+'</div>'}
function renderKPI(){let n=store.inspections.length,a=store.inspections.filter(i=>i.status==='Aprobado').length;let percent=n?Math.round(a/n*100):0;return '<div class="welcome"><div><h1>Indicadores KPI</h1><p>Métricas calculadas a partir de los registros locales.</p></div></div><div class="cards">'+[['Inspecciones totales',n],['Inspecciones aprobadas',a],['Cumplimiento',n?percent+'%':'—'],['NC abiertas',store.ncs.filter(x=>x.status!=='Cerrada').length]].map(c=>'<div class="card"><div class="label">'+c[0]+'</div><div class="num">'+c[1]+'</div></div>').join('')+'</div><div class="card" style="margin-top:14px"><div class="head"><h2>Definición de indicadores</h2></div><p>El cumplimiento de inspecciones se calcula como aprobadas / inspecciones registradas. Se incorporarán indicadores de cierre de NC, pruebas completadas, retrabajos, liberaciones y avance de ITP cuando se definan las reglas de cálculo.</p></div>'}
const necTopics=[['NEC Art. 110','Requisitos generales de instalación eléctrica, conexiones, equipos, accesibilidad y condiciones de trabajo.'],['NEC Art. 210','Circuitos derivados; revisión de circuitos, capacidad, protección y requisitos aplicables.'],['NEC Art. 215','Alimentadores; ampacidad, protección y dimensionamiento conforme al diseño.'],['NEC Art. 220','Cálculo de cargas; criterios de demanda y cargas aplicables.'],['NEC Art. 230','Servicios eléctricos; requisitos del equipo de acometida.'],['NEC Art. 240','Protección contra sobrecorriente; coordinación con conductores y equipos.'],['NEC Art. 250','Puesta a tierra y bonding; revisar subsecciones aplicables y diseño.'],['NEC Art. 300','Métodos de cableado; requisitos generales de instalación.'],['NEC Art. 310','Conductores; selección y ampacidad según condiciones de instalación.'],['NEC Art. 314','Cajas y accesorios; selección, instalación y llenado aplicable.'],['NEC Art. 358','EMT; requisitos del sistema de tubería metálica eléctrica.'],['NEC Art. 376','Wireways metálicos; instalación y condiciones aplicables.'],['NEC Art. 392','Cable tray; requisitos para bandejas portacables.'],['NEC Art. 408','Tableros; instalación, identificación y requisitos aplicables.']];
function renderNEC(){return '<div class="welcome"><div><h1>Biblioteca normativa</h1><p>Índice de temas de referencia para control QA/QC eléctrico.</p></div></div><div class="notice">Este índice no contiene texto oficial ni sustituye consultar la edición NEC adoptada, enmiendas locales, planos, especificaciones y criterios de ingeniería. Las referencias deberán validarse antes de emitir aceptación o rechazo.</div><div class="card">'+table(['Referencia','Área de revisión QA/QC','Estado de verificación'],necTopics.map(t=>'<tr><td><b>'+t[0]+'</b></td><td>'+t[1]+'</td><td><span class="status pending">Validar edición</span></td></tr>'))+'</div>'}
function toggleCheck(sys,i,v){store.checkstate[sys+'_'+i]=v;persist();render('Checklists')}function resetChecklist(){let sys=store.checklistSystem;checklistItems[sys].forEach((_,i)=>delete store.checkstate[sys+'_'+i);persist();render('Checklists')}function closeNC(i){store.ncs[i].status='Cerrada';persist();render('No conformidades')}function printReport(){let old=active;let html=$('#content').innerHTML;document.body.innerHTML='<main style="font:14px Arial;color:#111;padding:25px"><h1>ELECTRICAL QC 360 — Resumen</h1><p>Fecha: '+new Date().toLocaleString()+'</p>'+html+'</main>';window.print();location.reload()}
function render(view){active=view;$('#crumb').textContent=view;nav.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));let output=view==='Dashboard'?renderDashboard():view==='Proyectos'?renderProjects():view==='Inspecciones'?renderInspections():view==='Checklists'?renderChecklists():view==='Plan ITP'?renderITP():view==='Pruebas eléctricas'?renderTests():view==='No conformidades'?renderNC():view==='Informes'?renderReports():view==='Liberaciones'?renderRelease():view==='Indicadores KPI'?renderKPI():renderNEC();$('#content').innerHTML=output}
nav.innerHTML=menu.map(([n,i])=>'<button data-view="'+n+'"><span class="ico">'+i+'</span>'+n+'</button>').join('');nav.querySelectorAll('button').forEach(b=>b.onclick=()=>render(b.dataset.view));render('Dashboard');
</script></body></html>
