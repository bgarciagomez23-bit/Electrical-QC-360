function addinspection(){showModal('Nueva inspección QA/QC','<div class="formgrid">'+field('Actividad / elemento','ia','Ej. Inspección tablero TD-02')+selectfield('Sistema','isys',['Tableros eléctricos','Canalizaciones','Conductores y cableado','Puesta a tierra','Iluminación','Generadores','Transformadores','Motores','Otros'])+(areaOptions().length?selectfield('Área / ubicación','iloc',areaOptions()):field('Ubicación','iloc','Área o equipo'))+selectfield('Estado de inspección','ist',['Pendiente','En proceso','Aprobado','No aprobado'])+field('Referencia / criterio de aceptación','icrit','Plano, especificación, NEC aplicable, fabricante')+field('Fecha de inspección','idate',new Date().toISOString().slice(0,10),'date')+'</div>'+textarea('Observaciones / hallazgo','inote','Describe la condición encontrada, evidencia y acción requerida...')+'<div class="field"><label>Evidencia fotográfica (opcional)</label>'+photoPickerControls('iphoto')+'</div>','Guardar inspección',()=>{let a=$('#ia').value.trim();if(!a){alert('Ingresa la actividad');return}const file=$('#iphoto').files[0];const save=(photo='')=>{store.inspections.unshift({id:'INS-'+Date.now().toString().slice(-6),activity:a,system:$('#isys').value,location:$('#iloc').value,criteria:$('#icrit').value,status:$('#ist').value,date:$('#idate').value||new Date().toISOString().slice(0,10),note:$('#inote').value,photo});persist();$('#modalback').style.display='none';render('Inspecciones')};if(file){const reader=new FileReader();reader.onload=e=>{const img=new Image();img.onload=()=>{const canvas=document.createElement('canvas');const scale=Math.min(900/img.width,900/img.height,1);canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);save(canvas.toDataURL('image/jpeg',.65))};img.src=e.target.result};reader.readAsDataURL(file)}else save()})}

function addnc(){showModal('Registrar no conformidad','<div class="formgrid">'+field('Título del hallazgo','nt','Descripción breve')+selectfield('Sistema','ns',['Tableros eléctricos','Canalizaciones','Conductores','Puesta a tierra','Iluminación','Transformadores','Otros'])+selectfield('Clasificación','nc',['Observación','Menor','Mayor','Crítica'])+field('Ubicación / TAG','nloc','Área, equipo o referencia')+tagField('Vincular activo TAG Maestro','ntag')+field('Responsable','no','Responsable de corrección')+field('Fecha compromiso','nd','', 'date')+'</div>'+textarea('Descripción / evidencia','nn','Condición observada, ubicación y evidencia...')+textarea('Acción correctiva propuesta','na','Corrección y prevención...'),'Crear NC',()=>{if(!$('#nt').value.trim()){alert('Escribe el título');return}store.ncs.unshift({id:'NC-'+Date.now().toString().slice(-6),title:$('#nt').value,system:$('#ns').value,location:$('#nloc').value,tag:$('#ntag').value,class:$('#nc').value,owner:$('#no').value,due:$('#nd').value,desc:$('#nn').value,action:$('#na').value,status:'Abierta',date:new Date().toLocaleDateString(),verification:'',closedDate:''});persist();$('#modalback').style.display='none';render('No conformidades')})}
function ncDetail(i){const n=store.ncs[i];showModal('Detalle de no conformidad · '+(n.id||'NC'),'<div class="formgrid"><div class="field"><label>ID</label><div>'+esc(n.id||'—')+'</div></div><div class="field"><label>Fecha</label><div>'+esc(n.date||'—')+'</div></div><div class="field"><label>Clasificación</label><div>'+esc(n.class||'—')+'</div></div><div class="field"><label>Sistema</label><div>'+esc(n.system||'—')+'</div></div><div class="field"><label>Ubicación / TAG</label><div>'+esc(n.location||'—')+'</div></div><div class="field"><label>Responsable</label><div>'+esc(n.owner||'—')+'</div></div><div class="field"><label>Fecha compromiso</label><div>'+esc(n.due||'—')+'</div></div><div class="field"><label>Estado</label><div>'+esc(n.status||'—')+'</div></div></div><div class="field"><label>Descripción</label><div>'+esc(n.desc||'—')+'</div></div><div class="field"><label>Acción correctiva</label><div>'+esc(n.action||'—')+'</div></div><div class="field"><label>Verificación de cierre</label><div>'+esc(n.verification||'Pendiente')+'</div></div><div class="field"><label>Fecha de cierre</label><div>'+esc(n.closedDate||'—')+'</div></div>','Cerrar detalle',()=>$('#modalback').style.display='none')}
function closeNC(i){const n=store.ncs[i];if(n.status==='Cerrada')return;const v=prompt('Registrar verificación de corrección y reinspección antes de cerrar la NC:');if(!v||!v.trim()){alert('No se cerró la NC. La verificación es requerida.');return}n.verification=v.trim();n.status='Cerrada';n.closedDate=new Date().toLocaleDateString();persist();render('No conformidades')}
function addproject(){showModal('Nuevo proyecto',field('Nombre del proyecto','pn','Nombre')+field('Ubicación','pl','Ubicación')+field('Responsable','po','Responsable')+field('Avance (%)','pp','0','number'),'Crear proyecto',()=>{let n=$('#pn').value.trim();if(!n)return alert('Nombre requerido');store.projects.unshift({name:n,site:$('#pl').value,status:'En ejecución',owner:$('#po').value,progress:Number($('#pp').value||0)});persist();$('#modalback').style.display='none';render('Proyectos')})}
function addrelease(){showModal('Registrar liberación',field('Sistema / equipo','rl','Sistema a liberar')+tagField('Vincular activo TAG Maestro','rtag')+field('Responsable','ro','Responsable de aprobación')+selectfield('Estado','rs',['Pendiente','En revisión','Liberado','Rechazado'])+textarea('Condiciones / restricciones','rn','Pruebas verificadas, condiciones...'),'Guardar',()=>{if(!$('#rl').value.trim())return alert('Equipo/sistema requerido');store.releases.unshift({system:$('#rl').value,tag:$('#rtag').value,owner:$('#ro').value,status:$('#rs').value,note:$('#rn').value,date:new Date().toLocaleDateString()});persist();$('#modalback').style.display='none';render('Liberaciones')})}
function addDailyReport(){const projOpts=(store.projects||[]).map(p=>p.name);showModal('Nueva bitácora diaria QA/QC','<div class="formgrid">'+field('Fecha','drdate','','date')+selectfield('Proyecto','drproject',projOpts.length?projOpts:['Proyecto por configurar'])+(areaOptions().length?selectfield('Área / ubicación','drsite',areaOptions()):field('Área / ubicación','drsite','Ubicación de actividades'))+field('Avance del día (%)','drprogress','0','number')+'</div>'+textarea('Actividades ejecutadas','dractivities','Describe trabajos, áreas y alcance...')+textarea('Inspecciones realizadas','drinspections','Inspecciones efectuadas, equipos, resultados...')+textarea('Pruebas ejecutadas','drtests','Pruebas, lecturas y resultados...')+textarea('Hallazgos / pendientes','drfindings','Hallazgos, NC, acciones y responsables...')+textarea('Restricciones / riesgos','drrestrictions','Permisos, interferencias, materiales, seguridad...')+textarea('Plan del día siguiente','drnext','Actividades previstas y recursos...')+'<div class="field"><label>Evidencia fotográfica (máx. 6)</label>'+photoPickerControls('drphotos',true)+'</div>','Guardar bitácora',()=>{const activity=$('#dractivities').value.trim();const otherText=['drinspections','drtests','drfindings','drrestrictions','drnext'].some(id=>$('#'+id).value.trim());const progress=Number($('#drprogress').value||0);const files=Array.from($('#drphotos').files||[]).slice(0,6);if(!activity&&!otherText&&progress===0&&!files.length){alert('Ingresa información en al menos una casilla, registra un avance o agrega evidencia fotográfica.');return}const photos=[];let remaining=files.length;const save=()=>{store.dailyReports=store.dailyReports||[];store.dailyReports.unshift({id:'DR-'+Date.now().toString().slice(-6),date:$('#drdate').value||new Date().toISOString().slice(0,10),project:$('#drproject').value,site:$('#drsite').value,staff:$('#drstaff').value,progress:Math.max(0,Math.min(100,Number($('#drprogress').value||0))),activities:activity,inspections:$('#drinspections').value,tests:$('#drtests').value,findings:$('#drfindings').value,restrictions:$('#drrestrictions').value,next:$('#drnext').value,photos,dateCreated:new Date().toISOString()});persist();$('#modalback').style.display='none';render('Bitácora diaria')};if(!files.length)return save();files.forEach(f=>{const rd=new FileReader();rd.onload=e=>{const im=new Image();im.onload=()=>{const cv=document.createElement('canvas');const scale=Math.min(1000/im.width,1000/im.height,1);cv.width=Math.round(im.width*scale);cv.height=Math.round(im.height*scale);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);photos.push(cv.toDataURL('image/jpeg',.6));if(--remaining===0)save()};im.src=e.target.result};rd.readAsDataURL(f)})})}
function dailyReportDetail(i){const d=store.dailyReports[i];showModal('Bitácora '+d.id,'<div class="formgrid"><div class="field"><label>Fecha</label><div>'+esc(d.date)+'</div></div><div class="field"><label>Proyecto</label><div>'+esc(d.project)+'</div></div><div class="field"><label>Área / ubicación</label><div>'+esc(d.site||'—')+'</div></div><div class="field"><label>Personal</label><div>'+esc(d.staff||'—')+'</div></div><div class="field"><label>Avance del día</label><div>'+esc(d.progress)+'%</div></div></div>'+['activities','inspections','tests','findings','restrictions','next'].map((k,j)=>'<div class="field"><label>'+['Actividades','Inspecciones','Pruebas','Hallazgos','Restricciones','Plan siguiente día'][j]+'</label><div>'+esc(d[k]||'—').replace(/\\n/g,'<br>')+'</div></div>').join('')+(d.photos||[]).map(p=>'<img src="'+p+'" style="max-width:100%;border-radius:8px;margin:6px 0">').join(''),'Cerrar',()=>$('#modalback').style.display='none')}
function printDailyReport(i){const d=store.dailyReports[i];const photos=(d.photos||[]).map(p=>'<img src="'+p+'" style="width:30%;margin:8px;vertical-align:top">').join('');const w=window.open('','_blank');if(!w){alert('Permite ventanas emergentes para imprimir el informe');return}w.document.write('<html><head><title>Bitácora '+esc(d.id)+'</title><style>body{font-family:Arial;color:#222;padding:25px}h1{font-size:22px}h2{font-size:15px;margin-top:20px}p{white-space:pre-wrap;border-bottom:1px solid #ddd;padding:7px 0}</style></head><body><h1>ELECTRICAL QC 360 — Bitácora diaria QA/QC</h1><p><b>Registro:</b> '+esc(d.id)+' &nbsp; <b>Fecha:</b> '+esc(d.date)+'</p><p><b>Proyecto:</b> '+esc(d.project)+' &nbsp; <b>Ubicación:</b> '+esc(d.site||'—')+'</p><p><b>Personal:</b> '+esc(d.staff||'—')+' &nbsp; <b>Avance:</b> '+esc(d.progress)+'%</p>'+[['Actividades ejecutadas',d.activities],['Inspecciones realizadas',d.inspections],['Pruebas ejecutadas',d.tests],['Hallazgos / pendientes',d.findings],['Restricciones / riesgos',d.restrictions],['Plan del día siguiente',d.next]].map(([h,v])=>'<h2>'+h+'</h2><p>'+esc(v||'—')+'</p>').join('')+'<h2>Evidencia fotográfica</h2>'+photos+'<p>Elaboró: ____________________ &nbsp; QA/QC: ____________________ &nbsp; Firma: ____________________</p></body></html>');w.document.close();w.focus();w.print()}
function renderDailyReports(){store.dailyReports=store.dailyReports||[];return '<div class="welcome"><div><h1>Bitácora diaria QA/QC</h1><p>Registro diario de ejecución, calidad, personal, pruebas, restricciones y evidencia.</p></div><button class="btn" onclick="addDailyReport()">＋ Nueva bitácora</button></div><div class="notice">La evidencia fotográfica se almacena localmente en este navegador. Descarga respaldos periódicos; la recuperación cloud está pendiente de validación real.</div><div class="cards"><div class="card"><div class="label">Bitácoras</div><div class="num">'+store.dailyReports.length+'</div></div><div class="card"><div class="label">Avance promedio diario</div><div class="num">'+(store.dailyReports.length?Math.round(store.dailyReports.reduce((a,d)=>a+Number(d.progress||0),0)/store.dailyReports.length)+'%':'—')+'</div></div><div class="card"><div class="label">Registros con hallazgos</div><div class="num amber">'+store.dailyReports.filter(d=>d.findings).length+'</div></div><div class="card"><div class="label">Con evidencia</div><div class="num green">'+store.dailyReports.filter(d=>d.photos&&d.photos.length).length+'</div></div></div><div class="card" style="margin-top:14px">'+table(['Fecha / ID','Proyecto / Área','Avance','Actividades','Hallazgos','Evidencia','Acciones'],store.dailyReports.map((d,i)=>'<tr><td><b>'+esc(d.date)+'</b><br><small>'+esc(d.id)+'</small></td><td>'+esc(d.project)+'<br><small>'+esc(d.site||'—')+'</small></td><td>'+esc(d.progress)+'%</td><td>'+esc((d.activities||'').slice(0,80))+'</td><td>'+esc((d.findings||'—').slice(0,60))+'</td><td>'+(d.photos||[]).length+' foto(s)</td><td><button class="btn secondary sm" onclick="dailyReportDetail('+i+')">Detalle</button> <button class="btn secondary sm" onclick="editRecord(&quot;dailyReports&quot;, '+i+')">Modificar</button> <button class="btn danger sm" onclick="deleteRecord(&quot;dailyReports&quot;, '+i+')">Eliminar</button> <button class="btn sm" onclick="printDailyReport('+i+')">Imprimir / PDF</button></td></tr>'))+'</div>'}
function addMaterial(){const projects=(store.projects||[]).map(p=>p.name);showModal('Recepción técnica de materiales','<div class="formgrid">'+field('Fecha de recepción','mrdate','','date')+selectfield('Proyecto','mrproject',projects.length?projects:['Proyecto por configurar'])+tagField('Vincular activo TAG Maestro','mtag')+field('Proveedor','mrsupplier','Proveedor / fabricante')+field('Material / equipo','mritem','Descripción')+field('Cantidad recibida','mrqty','Cantidad','number')+field('Unidad','mrunit','Unidad (pza, m, kg...)')+field('Fabricante','mrbrand','Marca')+field('Modelo / especificación','mrmodel','Modelo / referencia')+field('Lote / serial','mrserial','Lote o número de serie')+field('Certificado / submittal','mrcert','Certificado, ficha técnica, documento')+field('Ubicación de almacenamiento','mrstore','Área / bodega')+selectfield('Evaluación de recepción','mrstatus',['Pendiente de inspección','Aceptado','Rechazado','En cuarentena'])+'</div>'+textarea('Observaciones / inspección','mrnotes','Estado físico, cantidad, daños, documentación, desviaciones...')+'<div class="field"><label>Foto de recepción (opcional)</label>'+photoPickerControls('mrphoto')+'</div>','Registrar recepción',()=>{if(!$('#mritem').value.trim()){alert('Ingresa la descripción del material');return}const file=$('#mrphoto').files[0];const save=(photo='')=>{store.materials=store.materials||[];store.materials.unshift({id:'MAT-'+Date.now().toString().slice(-6),date:$('#mrdate').value||new Date().toISOString().slice(0,10),project:$('#mrproject').value,tag:$('#mtag').value,supplier:$('#mrsupplier').value,item:$('#mritem').value,qty:$('#mrqty').value,unit:$('#mrunit').value,manufacturer:$('#mrbrand').value,model:$('#mrmodel').value,serial:$('#mrserial').value,certificate:$('#mrcert').value,storage:$('#mrstore').value,status:$('#mrstatus').value,notes:$('#mrnotes').value,photo});persist();$('#modalback').style.display='none';render('Recepción de materiales')};if(file){const reader=new FileReader();reader.onload=e=>{const img=new Image();img.onload=()=>{const canvas=document.createElement('canvas');const scale=Math.min(900/img.width,900/img.height,1);canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);save(canvas.toDataURL('image/jpeg',.6))};img.src=e.target.result};reader.readAsDataURL(file)}else save()})}
function createNCFromMaterial(i){const m=(store.materials||[])[i];if(!m)return;showModal('Crear NC desde recepción · '+esc(m.id),'<div class="formgrid">'+field('Título del hallazgo','mnctitle','Material / equipo observado')+selectfield('Clasificación','mncclass',['Observación','Menor','Mayor','Crítica'])+field('Responsable','mncowner','Responsable de corrección')+field('Fecha compromiso','mncdue','','date')+'</div>'+textarea('Descripción','mncdesc','Describe el rechazo, daño, documentación faltante o desviación...')+textarea('Acción correctiva','mncaction','Acción requerida...'),'Crear NC vinculada',()=>{const title=$('#mnctitle').value.trim()||('Recepción no conforme: '+m.item);store.ncs.unshift({id:'NC-'+Date.now().toString().slice(-6),title,system:'Recepción de materiales',location:m.project+' · '+m.item+' · '+(m.serial||m.id),class:$('#mncclass').value,owner:$('#mncowner').value,due:$('#mncdue').value,desc:$('#mncdesc').value,action:$('#mncaction').value,status:'Abierta',date:new Date().toLocaleDateString(),verification:'',closedDate:'',materialId:m.id});m.ncId=store.ncs[0].id;persist();$('#modalback').style.display='none';render('No conformidades')})}
function editMaterial(i){const m=(store.materials||[])[i];if(!m)return;const states=['Pendiente de inspección','Aceptado','Rechazado','En cuarentena'];const choice=prompt('Estado de recepción:\\n1 Pendiente de inspección\\n2 Aceptado\\n3 Rechazado\\n4 En cuarentena',String(states.indexOf(m.status)+1));if(choice===null)return;const idx=Number(choice)-1;if(!Number.isInteger(idx)||idx<0||idx>3){alert('Selección inválida');return}const inspector=prompt('Inspector / responsable:',m.inspector||'');if(inspector===null)return;const notes=prompt('Observaciones de inspección:', '') ;if(notes===null)return;m.history=m.history||[];m.history.push({date:new Date().toISOString(),from:m.status,to:states[idx],inspector,notes});m.status=states[idx];m.inspector=inspector;m.inspectionDate=new Date().toISOString().slice(0,10);if(notes.trim())m.inspectionNotes=(m.inspectionNotes||'')+'\\n['+m.inspectionDate+' · '+inspector+'] '+notes.trim();persist();render('Recepción de materiales')}
function renderMaterials(){store.materials=store.materials||[];const list=store.materials;return '<div class="welcome"><div><h1>Recepción técnica de materiales</h1><p>Registro de trazabilidad, inspección documental y aceptación de materiales/equipos.</p></div><button class="btn" onclick="addMaterial()">＋ Registrar recepción</button></div><div class="notice">Verifica especificación aprobada, fabricante, modelo, lote/serial, cantidades, daños, certificados y requisitos del proyecto antes de aceptar. El estado “Aceptado” es un registro interno y no sustituye la aprobación formal requerida.</div><div class="cards"><div class="card"><div class="label">Recepciones registradas</div><div class="num">'+list.length+'</div></div><div class="card"><div class="label">Aceptados</div><div class="num green">'+list.filter(m=>m.status==='Aceptado').length+'</div></div><div class="card"><div class="label">Pendientes</div><div class="num amber">'+list.filter(m=>m.status==='Pendiente de inspección').length+'</div></div><div class="card"><div class="label">Rechazados / cuarentena</div><div class="num red">'+list.filter(m=>m.status==='Rechazado'||m.status==='En cuarentena').length+'</div></div></div><div class="card" style="margin-top:14px">'+table(['Fecha / ID','Material','TAG','Proyecto','Proveedor','Qty','Fabricante / modelo','Lote / serial','Estado'],list.map(m=>'<tr><td><b>'+esc(m.id)+'</b><br>'+esc(m.date)+'</td><td>'+esc(m.item)+'</td><td>'+esc(m.tag||'—')+'</td><td>'+esc(m.project||'—')+'</td><td>'+esc(m.supplier||'—')+'</td><td>'+esc(m.qty||'—')+' '+esc(m.unit||'')+'</td><td>'+esc(m.manufacturer||'—')+'<br>'+esc(m.model||'—')+'</td><td>'+esc(m.serial||'—')+'</td><td>'+badge(m.status)+'</td><td><button class="btn secondary sm" onclick="editRecord(&quot;materials&quot;, '+list.indexOf(m)+')">Modificar</button> <button class="btn danger sm" onclick="deleteRecord(&quot;materials&quot;, '+list.indexOf(m)+')">Eliminar</button></td></tr>'))+'</div>'+list.map((m,i)=>'<div class="card" style="margin-top:10px"><div class="head"><h2>'+esc(m.id)+' · '+esc(m.item)+'</h2><button class="btn secondary sm" onclick="editMaterial('+i+')">Actualizar inspección</button><button class="btn secondary sm" onclick="printMaterial('+i+')">Imprimir registro</button></div><p class="muted">Certificado: '+esc(m.certificate||'—')+' · Almacenamiento: '+esc(m.storage||'—')+'</p><p>'+esc(m.notes||'Sin observaciones')+'</p>'+(m.photo?'<img src="'+m.photo+'" style="max-width:240px;border-radius:8px">':'')+(m.history&&m.history.length?'<div class="notice"><b>Historial de inspección</b><br>'+m.history.slice(-3).reverse().map(h=>'<small>'+esc(h.date?new Date(h.date).toLocaleString():m.inspectionDate||'')+' · '+esc(h.from)+' → '+esc(h.to)+' · '+esc(h.inspector||'—')+(h.notes?' · '+esc(h.notes):'')+'</small><br>').join('')+'</div>':'')+((m.status==='Rechazado'||m.status==='En cuarentena')?'<button class="btn danger sm" onclick="createNCFromMaterial('+i+')">Crear NC vinculada</button>':'')+'</div>').join('')}
function printMaterial(i){const m=(store.materials||[])[i];if(!m)return;const w=window.open('','_blank');if(!w){alert('Permite ventanas emergentes para imprimir');return}w.document.write('<html><head><title>Recepción '+esc(m.id)+'</title><style>body{font-family:Arial;padding:24px;color:#222}h1{font-size:22px}table{border-collapse:collapse;width:100%;margin:16px 0}td{border:1px solid #aaa;padding:8px}img{max-width:500px}</style></head><body><h1>ELECTRICAL QC 360 · Recepción técnica</h1><h2>'+esc(m.id)+'</h2><table>'+[['Fecha',m.date],['Proyecto',m.project],['Proveedor',m.supplier],['Material/equipo',m.item],['Cantidad',m.qty+' '+m.unit],['Fabricante',m.manufacturer],['Modelo',m.model],['Lote/serial',m.serial],['Certificado/submittal',m.certificate],['Almacenamiento',m.storage],['Estado',m.status],['Observaciones',m.notes]].map(x=>'<tr><td><b>'+esc(x[0])+'</b></td><td>'+esc(x[1]||'—')+'</td></tr>').join('')+'</table>'+(m.photo?'<img src="'+m.photo+'">':'')+'<p>Inspeccionado por: ____________________ &nbsp; Aprobación: ____________________</p></body></html>');w.document.close();w.focus();w.print()}
function renderDashboard(){store.materials=store.materials||[];let ins=store.inspections.length,tests=store.tests.length,nc=store.ncs.filter(n=>n.status!=='Cerrada').length;let mats=store.materials.length,matPending=store.materials.filter(m=>m.status==='Pendiente de inspección').length,matAccepted=store.materials.filter(m=>m.status==='Aceptado').length,matRejected=store.materials.filter(m=>m.status==='Rechazado'||m.status==='En cuarentena').length;let approved=store.inspections.filter(i=>i.status==='Aprobado').length;let compliance=ins?Math.round(approved/ins*100):'—';return '<div class="welcome"><div><h1>Dashboard de calidad</h1><p>Seguimiento integral de inspecciones, pruebas, hallazgos y liberaciones.</p></div><button class="btn" onclick="addinspection()">＋ Nueva inspección</button></div><div class="cards">'+[['Inspecciones registradas',ins,'Registros creados','☑'],['Cumplimiento de inspecciones',compliance==='—'?'—':compliance+'%',ins?'Calculado sobre registros':'Sin registros','◉'],['No conformidades abiertas',nc,'Pendientes de cierre','⚠'],['Pruebas eléctricas registradas',tests,'Resultados ingresados','ϟ']].map(c=>'<div class="card"><div class="kpi"><div><div class="label">'+c[0]+'</div><div class="num">'+c[1]+'</div><div class="foot">'+c[2]+'</div></div><div class="kicon">'+c[3]+'</div></div></div>').join('')+'</div><div class="card" style="margin-bottom:14px"><div class="head"><h2>Control de materiales</h2><button class="btn secondary sm" onclick="render(\'Recepción de materiales\')">Abrir módulo</button></div><div class="cards"><div class="card"><div class="label">Recepciones</div><div class="num">'+mats+'</div></div><div class="card"><div class="label">Pendientes de inspección</div><div class="num amber">'+matPending+'</div></div><div class="card"><div class="label">Aceptados</div><div class="num green">'+matAccepted+'</div></div><div class="card"><div class="label">Rechazados / cuarentena</div><div class="num red">'+matRejected+'</div></div></div><div class="activity">'+(matPending?'<div class="act"><div class="acticon">⚠</div><div><p><b>'+matPending+'</b> material(es) requieren inspección</p><small>Revisar recepción, certificados y estado físico antes de liberarlos</small></div></div>':'<div class="act"><div class="acticon">✓</div><div><p>Sin recepciones pendientes de inspección</p><small>El tablero se actualiza con los registros locales</small></div></div>')+(matRejected?'<div class="act"><div class="acticon">⚠</div><div><p><b>'+matRejected+'</b> material(es) rechazados o en cuarentena</p><small>Verificar NC vinculadas y evitar su instalación</small></div></div>':'')+'</div>'+table(['Fecha','Material','Proveedor','Estado'],store.materials.slice(0,5).map(m=>'<tr><td>'+esc(m.date||'—')+'</td><td><b>'+esc(m.item)+'</b><br><small>'+esc(m.id||'')+'</small></td><td>'+esc(m.supplier||'—')+'</td><td>'+badge(m.status)+'</td></tr>'))+'</div>'+'<div class="grid2"><div class="card"><div class="head"><h2>Proyectos activos</h2><small>'+store.projects.length+' proyecto(s)</small></div>'+table(['Proyecto','Ubicación','Avance'],store.projects.map(p=>'<tr><td><b>'+esc(p.name)+'</b></td><td>'+esc(p.site||'—')+'</td><td><b>'+Number(p.progress||0)+'%</b><div class="bar"><i style="width:'+Math.min(100,Math.max(0,p.progress||0))+'%"></i></div></td></tr>'))+'</div><div class="card"><div class="head"><h2>Alertas / enfoque</h2><small>Vista de control</small></div><div class="activity"><div class="act"><div class="acticon">⚠</div><div><p><b>'+nc+'</b> NC abiertas</p><small>Priorizar hallazgos críticos y fechas compromiso</small></div></div><div class="act"><div class="acticon">ϟ</div><div><p><b>'+tests+'</b> pruebas registradas</p><small>Documentar instrumentos y criterios antes de aceptación</small></div></div><div class="act"><div class="acticon">☑</div><div><p><b>'+ins+'</b> inspecciones creadas</p><small>Registrar evidencia, ubicación y aprobación</small></div></div></div></div></div><div class="grid2"><div class="card"><div class="head"><h2>Últimas inspecciones</h2><button class="btn secondary sm" onclick="render(\'Inspecciones\')">Ver todas</button></div>'+table(['Actividad','Sistema','Estado'],store.inspections.slice(0,5).map(i=>'<tr><td>'+esc(i.activity)+'</td><td>'+esc(i.system)+'</td><td>'+badge(i.status)+'</td></tr>'))+'</div><div class="card"><div class="head"><h2>Datos y criterios</h2></div><div class="notice">Los valores del tablero se calculan con los registros que agregues. No contiene datos reales de obra ni criterios normativos precargados.</div><p class="muted">Antes de liberar un equipo: validar planos, especificaciones, checklist, pruebas requeridas, no conformidades, identificación y autorización.</p></div></div>'}

function inspectionDetail(i){let x=store.inspections[i];if(!x)return;const grid='<div class="formgrid"><div class="field"><label>Actividad</label><div>'+esc(x.activity||'—')+'</div></div><div class="field"><label>Sistema</label><div>'+esc(x.system||'—')+'</div></div><div class="field" style="grid-column:1/-1"><label>Ubicación</label><div>'+esc(x.location||'—')+'</div></div><div class="field"><label>Estado</label><div>'+badge(x.status||'—')+'</div></div><div class="field"><label>Fecha</label><div>'+esc(x.date||'—')+'</div></div><div class="field" style="grid-column:1/-1"><label>Criterio / referencia</label><div>'+esc(x.criteria||'—')+'</div></div><div class="field" style="grid-column:1/-1"><label>Observaciones</label><div>'+esc(x.note||'—').replace(/\\n/g,'<br>')+'</div></div></div>';const evidence=x.photo?'<div class="field"><label>Evidencia</label><img src="'+x.photo+'" style="max-width:100%;border-radius:10px;border:1px solid var(--line);display:block"><button class="btn secondary sm" onclick="sketchPhoto(store.inspections['+i+'].photo,p=>{store.inspections['+i+'].photo=p;persist();inspectionDetail('+i+')})">Dibujar sobre foto</button></div>':'<p class="muted">Sin evidencia fotográfica adjunta.</p>';showModal('Detalle de inspección · '+(x.id||'Registro'),grid+evidence,'Cerrar',()=>$('#modalback').style.display='none')}function renderInspections(){return '<div class="welcome"><div><h1>Inspecciones QA/QC</h1><p>Registro trazable de actividades, criterios de aceptación y evidencia de campo.</p></div><button class="btn" onclick="addinspection()">＋ Nueva inspección</button></div><div class="notice">Documenta criterios verificables con planos aprobados, NEC aplicable, especificaciones del proyecto y fabricante. La aplicación no decide automáticamente cumplimiento normativo.</div><div class="card"><div class="head"><h2>Registro de inspecciones</h2><small>'+store.inspections.length+' registros</small></div>'+table(['ID / Fecha','Actividad','Ubicación','Sistema','Estado','Detalle'],store.inspections.map((i,idx)=>'<tr><td><b>'+esc(i.id||'—')+'</b><br>'+esc(i.date||'—')+'</td><td><b>'+esc(i.activity||'—')+'</b></td><td>'+esc(i.location||'—')+'</td><td>'+esc(i.system||'—')+'</td><td>'+badge(i.status)+'</td><td><button class="btn secondary sm" onclick="inspectionDetail('+idx+')">Ver detalle</button> <button class="btn secondary sm" onclick="editRecord(&quot;inspections&quot;, '+idx+')">Modificar</button> <button class="btn danger sm" onclick="deleteRecord(&quot;inspections&quot;, '+idx+')">Eliminar</button></td></tr>'))+'</div>'}const checklistItems={'Tableros eléctricos':['Identificación del tablero y circuitos coincide con planos','Gabinete, puertas y barreras sin daños visibles','Accesibilidad y espacio de trabajo verificados','Conexiones y terminaciones inspeccionadas','Barras y terminales identificados según proyecto','Protecciones y ajustes contrastados con estudio / diseño','Puesta a tierra y bonding inspeccionados','Torque documentado según fabricante cuando requerido','Pruebas y registros adjuntos','Tapa, rotulación y cierre final verificados'],'Canalizaciones':['Ruta conforme a planos aprobados','Soportes y espaciamiento según sistema y especificación','Bordes, uniones y accesorios sin daño','Protección contra corrosión verificada','Separación de otros sistemas según diseño','Continuidad / bonding cuando requerido','Sellos y penetraciones ejecutados según detalle','Bujes y protección en entradas','Limpieza y ausencia de obstrucciones','Identificación y entrega de evidencia'],'Conductores y cableado':['Tipo, calibre y material conforme a planos','Identificación de circuito y fases','Inspección visual de aislamiento','Radio de curvatura y manipulación conforme fabricante','Empalmes y terminaciones aprobados','Separación / agrupamiento revisados','Continuidad cuando aplica','Prueba de aislamiento con método y voltaje aprobado','Etiquetado en ambos extremos','Resultados y evidencia registrados'],'Puesta a tierra':['Conductor PE y bonding identificados','Conexiones mecánicas o exotérmicas inspeccionadas','Uniones accesibles y protegidas','Electrodos / malla conforme planos','Equipotencialidad verificada donde aplica','Continuidad del conductor de protección registrada','Medición de resistencia con método documentado','Instrumento y calibración registrados','Resultados comparados con criterio de proyecto','Registro fotográfico y ubicación'],'Iluminación':['Luminaria y modelo conforme especificación','Montaje y fijación completos','Conexiones y polaridad revisadas','Circuito y protección identificados','Control / sensor probado cuando aplica','Prueba funcional de encendido','Medición lux si especificado','Condición de emergencia verificada cuando aplica','Limpieza y acabado','Evidencia y cierre']};
function renderChecklists(){let systems=Object.keys(checklistItems);let sel=store.checklistSystem||systems[0];store.checklistSystem=sel;let items=checklistItems[sel];let done=items.filter((_,i)=>store.checkstate[sel+'_'+i]).length;return '<div class="welcome"><div><h1>Checklists de inspección</h1><p>Lista de verificación por sistema. Marca solo elementos verificados en sitio.</p></div></div><div class="notice">Los checklist son una base de inspección; criterios de aceptación específicos deben venir de planos, NEC aplicable, especificaciones, fabricante o ingeniería aprobada. No sustituyen pruebas ni documentación.</div><div class="card"><div class="toolbar"><select class="search" onchange="store.checklistSystem=this.value;persist();render(\'Checklists\')">'+systems.map(s=>'<option '+(s===sel?'selected':'')+'>'+s+'</option>').join('')+'</select><span class="tag">'+done+' / '+items.length+' completados</span><button class="btn secondary sm" onclick="printChecklist()">Imprimir protocolo</button><button class="btn secondary sm" onclick="resetChecklist()">Reset checklist</button></div><div class="bar"><i style="width:'+Math.round(done/items.length*100)+'%"></i></div>'+items.map((it,i)=>'<label class="checkrow"><input type="checkbox" '+(store.checkstate[sel+'_'+i]?'checked':'')+' onchange="toggleCheck(\''+sel+'\','+i+',this.checked)"><span>'+esc(it)+'<small>Estado: '+(store.checkstate[sel+'_'+i]?'Verificado':'Sin verificar')+'</small></span></label>').join('')+'</div>'}

function tagNormalize(v){return String(v||'').trim().toUpperCase()}function tagMatch(record,tag){if(tagNormalize(record.tag))return tagNormalize(record.tag)===tag;return tagNormalize(record.location).includes(tag)||tagNormalize(record.system).includes(tag)||tagNormalize(record.equipment).includes(tag)}function addTag(){showModal('Registrar equipo en TAG Maestro','<div class="formgrid">'+field('TAG único','tagid','Ej. TD-02')+field('Nombre del equipo','tagname','Tablero de distribución')+selectfield('Categoría','tagcat',['Tablero','Transformador','Motor','Circuito / alimentador','Generador','Canalización','Equipo de medición','Otro'])+field('Sistema / área','tagsys','Sistema o ubicación')+field('Proyecto','tagproj','Proyecto')+field('Fabricante / modelo','tagmodel','Marca, modelo')+field('Tensión nominal','tagvoltage','V / kV')+field('Capacidad','tagcap','A / kVA / HP')+field('Responsable','tagowner','Responsable')+'</div>'+textarea('Notas','tagnotes','Detalles adicionales...'),'Crear TAG',()=>{const tag=tagNormalize($('#tagid').value);if(!tag)return alert('TAG requerido');store.assets=store.assets||[];if(store.assets.some(a=>tagNormalize(a.tag)===tag))return alert('Este TAG ya existe');store.assets.unshift({id:'ASSET-'+Date.now().toString().slice(-6),tag,name:$('#tagname').value,category:$('#tagcat').value,system:$('#tagsys').value,project:$('#tagproj').value,model:$('#tagmodel').value,voltage:$('#tagvoltage').value,capacity:$('#tagcap').value,owner:$('#tagowner').value,notes:$('#tagnotes').value,date:new Date().toLocaleDateString()});persist();$('#modalback').style.display='none';render('TAG Maestro')})}function assetCondition(a){const t=tagNormalize(a.tag),ncs=(store.ncs||[]).filter(x=>tagMatch(x,t)&&x.status!=='Cerrada'),badIns=(store.inspections||[]).filter(x=>tagMatch(x,t)&&x.status==='No aprobado'),badTests=(store.tests||[]).filter(x=>tagMatch(x,t)&&x.status==='No conforme'),events=(store.assetEvents||[]).filter(x=>tagNormalize(x.tag)===t),failed=events.filter ado en este navegador. Revisa los módulos y descarga una copia de seguridad.');render('Dashboard')}catch(err){alert('No se pudo restaurar: '+err.message)}input.value=''};reader.readAsText(file)}

function sketchPhoto(photo,saveCallback){if(!photo){alert('Primero agrega o toma una fotografía.');return;}const toolbar='<div style="display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px;align-items:center"><button class="btn secondary sm" onclick="sketchSetMode(\'free\')">✏️ Dibujo</button><button class="btn secondary sm" onclick="sketchSetMode(\'circle\')">⭕ Círculo</button><input type="color" id="sketchcolor" value="#ff3333" title="Color" onchange="sketchSetColor(this.value)" style="width:42px;height:34px"><input type="date" id="sketchdate" style="background:#081625;color:#fff;border:1px solid #20364f;border-radius:7px;padding:6px;color-scheme:dark"><button class="btn secondary sm" onclick="sketchAddDate()">＋ Fecha</button><button class="btn ghost sm" onclick="sketchPhotoUndo()">↶ Limpiar marcas</button></div>';showModal('Bosquejo / anotaciones sobre fotografía',toolbar+'<div style="overflow:auto"><canvas id="sketchcanvas" style="max-width:100%;border:1px solid #345;touch-action:none"></canvas></div><p class="muted">Elige dibujo o círculo, selecciona color y agrega una fecha sobre la fotografía.</p>','Guardar bosquejo',()=>{saveCallback($('#sketchcanvas').toDataURL('image/jpeg',.82));$('#modalback').style.display='none';});const c=$('#sketchcanvas'),img=new Image();img.onload=()=>{const scale=Math.min(800/img.width,600/img.height,1);c.width=img.width*scale;c.height=img.height*scale;sketchCtx=c.getContext('2d');sketchOriginalImage=img;sketchCtx.drawImage(img,0,0,c.width,c.height);sketchCtx.strokeStyle=sketchColor='#ff3333';sketchCtx.lineWidth=4;sketchCtx.lineCap='round';let drawing=false,startX=0,startY=0,base=null;c.onpointerdown=e=>{drawing=true;c.setPointerCapture(e.pointerId);const r=c.getBoundingClientRect();startX=(e.clientX-r.left)*c.width/r.width;startY=(e.clientY-r.top)*c.height/r.height;base=sketchCtx.getImageData(0,0,c.width,c.height);sketchCtx.beginPath();sketchCtx.moveTo(startX,startY)};c.onpointermove=e=>{if(!drawing)return;const r=c.getBoundingClientRect(),x=(e.clientX-r.left)*c.width/r.width,y=(e.clientY-r.top)*c.height/r.height;if(sketchMode==='free'){sketchCtx.lineTo(x,y);sketchCtx.stroke()}else{sketchCtx.putImageData(base,0,0);sketchCtx.beginPath();sketchCtx.arc(startX,startY,Math.hypot(x-startX,y-startY),0,Math.PI*2);sketchCtx.stroke()}};c.onpointerup=c.onpointercancel=()=>drawing=false;};img.src=photo;}

 const list=store.reminders.slice().sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'));
 const pending=list.filter(r=>!r.done), overdue=pending.filter(r=>r.date&&r.date<today), completed=list.filter(r=>r.done);
 return '<div class="welcome"><div><h1>Recordatorios</h1><p>Seguimiento de pendientes, fechas y actividades por completar.</p></div><button class="btn" onclick="addReminder()">＋ Nuevo recordatorio</button></div>'+
 '<div class="cards"><div class="card"><div class="label">Pendientes</div><div class="num">'+pending.length+'</div></div><div class="card"><div class="label">Vencidos</div><div class="num red">'+overdue.length+'</div></div><div class="card"><div class="label">Completados</div><div class="num green">'+completed.length+'</div></div><div class="card"><div class="label">Total</div><div class="num">'+list.length+'</div></div></div>'+
 '<div class="card" style="margin-top:14px"><div class="head"><h2>Lista de recordatorios</h2><small>Checklist de cumplimiento</small></div>'+
 (list.length?list.map(r=>'<div style="display:flex;gap:10px;align-items:flex-start;border-bottom:1px solid var(--line);padding:12px 0"><input type="checkbox" '+(r.done?'checked':'')+' onchange="toggleReminder(\''+r.id+'\',this.checked)" style="margin-top:4px"><div style="flex:1"><b '+(r.done?'style="text-decoration:line-through;color:var(--muted)"':'')+'>'+esc(r.title)+'</b><div class="foot">'+(r.date?'Fecha: '+esc(r.date):'Sin fecha')+(r.area?' · Área: '+esc(r.area):'')+'</div>'+(r.detail?'<div style="margin-top:6px">'+esc(r.detail)+'</div>':'')+(r.notes?'<div class="foot" style="margin-top:4px">Observaciones: '+esc(r.notes)+'</div>':'')+'</div><button class="btn secondary sm" onclick="editReminder(\''+r.id+'\')">Editar</button><button class="btn danger sm" onclick="deleteReminder(\''+r.id+'\')">Eliminar</button></div>').join(''):'<p class="foot">No hay recordatorios. Agrega uno con Nuevo recordatorio.</p>')+'</div>';
}
function addReminder(){reminderForm({})}
function editReminder(id){const r=(store.reminders||[]).find(x=>x.id===id);if(r)reminderForm(r)}
function reminderForm(r){
 const photoBlock='<div class="field"><label>Fotografía del recordatorio</label><input id="remPhotoFile" type="file" accept="image/*" capture="environment" onchange="handleReminderPhoto(event)"><small class="foot">Puedes agregar una imagen desde tu galería o tomar una foto con la cámara.</small><div id="remPhotoPreview" style="margin-top:8px">'+(r.photo?'<img src="'+r.photo+'" style="max-width:100%;max-height:260px;border-radius:10px"><button type="button" class="btn secondary sm" onclick="removeReminderPhoto()">Quitar foto</button>':'')+'</div><input type="hidden" id="remPhotoData" value="'+(r.photo||'')+'"></div>';
 const body='<div class="field"><label>Título</label><input id="remTitle" value="'+esc(r.title||'')+'"></div><div class="field"><label>Fecha de cumplimiento</label><input id="remDate" type="date" value="'+esc(r.date||'')+'"></div><div class="field"><label>Área / ubicación</label><input id="remArea" value="'+esc(r.area||'')+'"></div>'+photoBlock+'<div class="field"><label>Detalle</label><textarea id="remDetail">'+esc(r.detail||'')+'</textarea></div><div class="field"><label>Observaciones</label><textarea id="remNotes">'+esc(r.notes||'')+'</textarea></div>';
 showModal(r.id?'Editar recordatorio':'Nuevo recordatorio',body,'Guardar',()=>saveReminder(r.id||''));
}
function handleReminderPhoto(event){
 const file=event.target.files&&event.target.files[0];if(!file)return;
 if(!file.type.startsWith('image/')){alert('Selecciona un archivo de imagen.');return}
 const reader=new FileReader();reader.onload=function(){
  const img=new Image();img.onload=function(){
   const max=1200,scale=Math.min(1,max/Math.max(img.width,img.height)),canvas=document.createElement('canvas');
   canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);
   canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
   const data=canvas.toDataURL('image/jpeg',0.72);$('#remPhotoData').value=data;
   $('#remPhotoPreview').innerHTML='<img src="'+data+'" style="max-width:100%;max-height:260px;border-radius:10px"><button type="button" class="btn secondary sm" onclick="removeReminderPhoto()">Quitar foto</button>';
  };img.onerror=function(){alert('No se pudo cargar la imagen seleccionada.');};img.src=reader.result;
 };reader.readAsDataURL(file);
}
function removeReminderPhoto(){ $('#remPhotoData').value='';$('#remPhotoPreview').innerHTML='';if($('#remPhotoFile'))$('#remPhotoFile').value='';}
function saveReminder(id){
 const title=$('#remTitle').value.trim();if(!title){alert('Ingresa un título para el recordatorio.');return}
 store.reminders=store.reminders||[];let r=store.reminders.find(x=>x.id===id);
 if(!r){r={id:'rem_'+Date.now(),done:false,createdAt:new Date().toISOString()};store.reminders.push(r)}
 Object.assign(r,{title,date:$('#remDate').value,area:$('#remArea').value.trim(),detail:$('#remDetail').value.trim(),notes:$('#remNotes').value.trim(),photo:$('#remPhotoData').value});
 persist();$('#modalback').style.display='none';render('Recordatorios');
}
function toggleReminder(id,done){const r=(store.reminders||[]).find(x=>x.id===id);if(r){r.done=done;r.completedAt=done?new Date().toISOString():null;persist();render('Recordatorios')}}
function deleteReminder(id){if(confirm('¿Eliminar este recordatorio?')){store.reminders=(store.reminders||[]).filter(x=>x.id!==id);persist();render('Recordatorios')}}

function render(view){active=view;$('#crumb').textContent=labels[view]||view;nav.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));let output=view==='Recordatorios'?renderReminders():view==='Áreas'?renderAreas():view==='Levantamiento de equipos'?renderEquipmentSurvey():view==='Dashboard'?renderDashboard():view==='Proyectos'?renderProjects():view==='Inspecciones'?renderInspections():view==='Bitácora diaria'?renderDailyReports():view==='Recepción de materiales'?renderMaterials():view==='Checklists'?renderChecklists():view==='Plan ITP'?renderITP():view==='Pruebas eléctricas'?renderTests():view==='No conformidades'?renderNC():view==='Informes'?renderReports():view==='Liberaciones'?renderRelease():view==='TAG Maestro'?renderTagMaster():view==='Trazabilidad'?renderTraceability():view==='Indicadores KPI'?renderKPI():view==='Nube y respaldos'?renderCloud():renderNEC();$('#content').innerHTML='<div class="notice" style="border-color:#24527b;background:#10243a;color:#c7def5"><b>¿Qué puedes hacer aquí?</b><br>'+esc(help[view]||'Consulta y administra la información de este módulo.')+'</div>'+output}
nav.innerHTML=menu.map(([n,i])=>'<button data-view="'+n+'"><span class="ico">'+i+'</span>'+ (labels[n]||n)+'</button>').join('');nav.querySelectorAll('button').forEach(b=>b.onclick=()=>render(b.dataset.view));render('Dashboard');startCloudSync();
let eqPhotoZoomScale=1;function openEquipmentPhotoZoom(src){let z=document.getElementById('eqPhotoZoom');if(!z){z=document.createElement('div');z.id='eqPhotoZoom';z.innerHTML='<div id="eqPhotoZoomTop"><button onclick="closeEquipmentPhotoZoom()">✕ Cerrar</button></div><img id="eqPhotoZoomImg" alt="Fotografía de equipo ampliada"><div id="eqPhotoZoomControls"><button onclick="changeEquipmentPhotoZoom(-.25)">−</button><button onclick="resetEquipmentPhotoZoom()">↺</button><span id="eqPhotoZoomLabel">100%</span><button onclick="changeEquipmentPhotoZoom(.25)">+</button></div>';z.addEventListener('click',e=>{if(e.target===z)closeEquipmentPhotoZoom()});document.body.appendChild(z);const img=z.querySelector('#eqPhotoZoomImg');img.addEventListener('wheel',e=>{e.preventDefault();changeEquipmentPhotoZoom(e.deltaY<0?.15:-.15)},{passive:false});}const img=document.getElementById('eqPhotoZoomImg');img.src=src;eqPhotoZoomScale=1;updateEquipmentPhotoZoom();z.classList.add('open')}function changeEquipmentPhotoZoom(delta){eqPhotoZoomScale=Math.max(.5,Math.min(4,eqPhotoZoomScale+delta));updateEquipmentPhotoZoom()}function resetEquipmentPhotoZoom(){eqPhotoZoomScale=1;updateEquipmentPhotoZoom()}function updateEquipmentPhotoZoom(){const img=document.getElementById('eqPhotoZoomImg'),label=document.getElementById('eqPhotoZoomLabel');if(img)img.style.transform='scale('+eqPhotoZoomScale+')';if(label)label.textContent=Math.round(eqPhotoZoomScale*100)+'%'}function closeEquipmentPhotoZoom(){const z=document.getElementById('eqPhotoZoom');if(z)z.classList.remove('open')}</script></body></html>
